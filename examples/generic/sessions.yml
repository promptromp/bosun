# One tmux window per entry. `name` is the window's name, and the name its session is resumed by: the
# most recent session with exactly this name in `dir` (no picker); if none exists, a new one is created.
# On Claude Code it is also --name and the Remote Control session. On Codex bosun keeps its own table.
# Optional per window: `model` (opus, sonnet, haiku, fable or a full name) and `effort` (low,
# medium, high, xhigh, max); defaults: BOSUN_MODEL / BOSUN_EFFORT in bosun.env.
# Optional per window: `harness` (claude or codex), to run this one on another agent than BOSUN_HARNESS.
# On Codex `model` is one of its models, and the default is BOSUN_CODEX_MODEL.
sessions:
  - name: my-service
    dir: ~/Development/my-service
  - name: my-frontend
    dir: ~/Development/my-frontend
