[project]
name = "bosun-dev"
version = "0"
description = "Development tooling for bosun (the tool itself is bash plus stdlib Python)."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "check-jsonschema>=0.39.0",
    "complexipy>=4",
    "detect-secrets>=1.5",
    "hadolint-bin>=2.15.1",
    "lizard>=1.17",
    "mypy>=1.15",
    "pillow>=11",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "pytest-impacted[fast]>=0.38.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.11",
    "shellcheck-py>=0.10",
    "shfmt-py>=3.7",
    "typos>=1.51.1",
    "zizmor>=1.31.1",
]
# The docs site (mkdocs.yml). Its own group, so the publishing workflow installs only this.
docs = [
    "mdx-truly-sane-lists>=1.3",
    "mkdocs-material>=9.8",
]

[tool.uv]
package = false
default-groups = ["dev", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
# With -n: an idle worker takes tests from a busy one's queue (the default hands each worker its next
# tests up front, so one that drew several slow ones, the ten-second corpus replay or a few uninstall
# runs, finished long after the rest). Measured 4-5% faster on 4 workers, the same as loadfile.
addopts = ["--dist=worksteal"]
pythonpath = ["lib"]
# pytest-impacted: the commit hook runs only the tests a change can reach (`pytest --impacted`, in
# .pre-commit-config.yaml); CI and `tests/smoke.sh --with-unit` run them all. Its import analysis
# follows the imports of lib/ (each `pythonpath` entry is an import root, so `import ledger` is
# lib/ledger.py) and of the test files, including the helpers in tests/unit that tests import.
# Everything else a test depends on is a rule here. A rule that is wrong must select more, never
# less: what bosun's code reads as it runs counts as a change to its programs (bin/bosun), the
# fixtures and the tests' own loaders invalidate all. tests/unit/test_impacted_rules.py checks
# that every file has a rule and that the plugin follows the imports here; impacted_guard.py that
# each file a test reads or runs selects that test. `**` matches any depth, `*` one segment, both
# from the right (pytest_impacted.strategies.matches_any_glob).
impacted_module = "lib"
impacted_tests_dir = "tests/unit"
impacted_map = [
    # Any change runs the rules' own check: a new kind of file needs a rule before it is missed.
    "*=tests/unit/test_impacted_rules.py",
    # ... and the smoke selection's: a new file needs a section's `covers` or a rule there, or it is missed.
    "*=tests/unit/test_smoke_selection.py",
    # ... and the Mac VM selection's: the same for a part's `covers` or a rule of tests/vm_selection.txt.
    "*=tests/unit/test_vm_selection.py",
    # bosun's programs. The tests that run them, or read them, import nothing of what they run, and
    # the shell runs every lib/ module: a change to any of them counts as one to bin/bosun, and a
    # change to bin/bosun selects those tests.
    "lib/*.py=bin/bosun",
    "lib/*.sh=bin/bosun",
    "lib/*/*.sh=bin/bosun",
    "libexec/*=bin/bosun",
    # ... and the agents' profiles as the shell reads them, a table written from lib/agent_state.py, which
    # its test holds to the code.
    "lib/agent_profiles.tsv=bin/bosun",
    "lib/agent_profiles.tsv=tests/unit/test_agent_profiles.py",
    "get.sh=bin/bosun",
    "install.sh=bin/bosun",
    "uninstall.sh=bin/bosun",
    # What bosun's programs read as they run (the orchestrator's prompts, task files and settings, the
    # launchd templates, the console's page, the example config, the agy plugin) counts as a change to
    # them, as lib/*.sh does, plus the tests that read it in their own process (impacted_guard.py names
    # a missing one). Measured: about 15% of the suite each, where they ran every test.
    "orchestrator/**=bin/bosun",
    "orchestrator/**=tests/unit/test_console_library.py",
    "orchestrator/**=tests/unit/test_console_server.py",
    "orchestrator/**=tests/unit/test_guard.py",
    "orchestrator/**=tests/unit/test_learn.py",
    "orchestrator/**=tests/unit/test_task_table.py",
    "templates/*=bin/bosun",
    "console/*=bin/bosun",
    "console/*=tests/unit/test_app_icons.py",
    "console/*=tests/unit/test_console_server.py",
    "console/*=tests/unit/test_console_token.py",
    "examples/*/*=bin/bosun",
    "examples/*/*=tests/unit/test_contract_samples.py",
    "examples/*/*=tests/unit/test_init_plan.py",
    "examples/*/*=tests/unit/test_settings.py",
    "examples/*/*=tests/unit/test_workstreams.py",
    "agents/*/*=bin/bosun",
    "agents/*/*=tests/unit/test_agy_plugin.py",
    "bin/bosun=tests/unit/test_agent_names.py",
    "bin/bosun=tests/unit/test_agent_profiles.py",
    "bin/bosun=tests/unit/test_claude_state.py",
    "bin/bosun=tests/unit/test_corpus.py",
    "bin/bosun=tests/unit/test_delegate.py",
    "bin/bosun=tests/unit/test_launch_record.py",
    "bin/bosun=tests/unit/test_learn_digest.py",
    "bin/bosun=tests/unit/test_migrations.py",
    "bin/bosun=tests/unit/test_preflight.py",
    "bin/bosun=tests/unit/test_shell_functions.py",
    "bin/bosun=tests/unit/test_smoke_selection.py",
    "bin/bosun=tests/unit/test_uninstall_plan.py",
    "bin/bosun=tests/unit/test_settings.py",
    "bin/bosun=tests/unit/test_update.py",
    "bin/bosun=tests/unit/test_update_back.py",
    "bin/bosun=tests/unit/test_update_facts.py",
    "bin/bosun=tests/unit/test_update_gate.py",
    # What a test reads of bosun's programs to hold a constant to it (the watchdog job's interval), or a
    # command's usage to its table (the watchdog's checks).
    "lib/common.sh=tests/unit/test_menu_status.py",
    "libexec/bosun-watchdog=tests/unit/test_watchdog_usage.py",
    # The docs: bosun's code never reads them. A change counts as one to the site (mkdocs.yml),
    # whose change selects the tests that read a page.
    "docs/**=mkdocs.yml",
    "theme/*=mkdocs.yml",
    "[A-Z]*.md=mkdocs.yml",
    "mkdocs.yml=tests/unit/test_task_table.py",
    "mkdocs.yml=tests/unit/test_docs_examples.py",
    "mkdocs.yml=tests/unit/test_update.py",
    "mkdocs.yml=tests/unit/test_update_summary.py",
    # Python outside the folders the analysis walks: tools/ (two of which import lib/ modules),
    # and the helpers in tests/llm and tests/sandbox that unit tests import or run.
    "tools/*.py=tests/unit/test_check_links.py",
    "tools/*.py=tests/unit/test_docs_examples.py",
    "tools/*.py=tests/unit/test_forbidden_terms.py",
    "tools/*.py=tests/unit/test_mkdocs_hooks.py",
    "tools/*.py=tests/unit/test_survey_to_kg.py",
    "tools/*.py=tests/unit/test_release.py",
    "lib/*.py=tools/docs_examples.py",
    "lib/*.py=tools/survey_to_kg.py",
    "lib/*.py=tools/release.py",
    # The menu bar app's contract fixtures (tools/contract_samples.py writes them from part 1's
    # modules, which it imports) and the coverage tool. The app's Swift and its config are read by no
    # Python test: a change there runs the rules' own check, as .github/* does.
    "tools/*.py=tests/unit/test_contract_samples.py",
    "tools/*.py=tests/unit/test_swift_coverage.py",
    "lib/*.py=tools/contract_samples.py",
    "tools/*.sh=tests/unit/test_impacted_rules.py",
    "tools/swift_hook.sh=tests/unit/test_swift_hook.py",
    "tools/bash32_hook.sh=tests/unit/test_bash32_hook.py",
    # The app's pictures, the tool that makes them from the logo, and the logo itself.
    "tools/app_icons.py=tests/unit/test_app_icons.py",
    "docs/assets/logo.png=tests/unit/test_app_icons.py",
    "app/Resources/*=tests/unit/test_app_icons.py",
    "app/Resources/MenuBarIcon@2x.png=tests/unit/test_docs_examples.py",
    "app/Sources/BosunMenuCore/MenuModel.swift=tests/unit/test_docs_examples.py",
    "app/Tests/BosunMenuCoreTests/Fixtures/*=tests/unit/test_docs_examples.py",
    "app/Tests/BosunMenuCoreTests/Fixtures/*=tests/unit/test_mkdocs_hooks.py",
    "app/Resources/*/*=tests/unit/test_app_icons.py",
    "app/Tests/BosunMenuCoreTests/Fixtures/*=tests/unit/test_contract_samples.py",
    "app/*=tests/unit/test_impacted_rules.py",
    "app/*/*=tests/unit/test_impacted_rules.py",
    "app/*/*/*=tests/unit/test_impacted_rules.py",
    "app/*/*/*/*=tests/unit/test_impacted_rules.py",
    # get.sh: plain sh, run by its own test (and its tag rule held to lib/update_check.py's there).
    "get.sh=tests/unit/test_get_sh.py",
    # The smoke suite's section markers (its --list and --only run by them) and what it keeps between runs.
    "tests/smoke.sh=tests/unit/test_smoke_sections.py",
    "tests/smoke.sh=tests/unit/test_smoke_cache.py",
    "tests/smoke_cache.sh=tests/unit/test_smoke_sections.py",
    "tests/smoke_cache.sh=tests/unit/test_smoke_cache.py",
    "tests/smoke.sh=tests/unit/test_smoke_state.py",
    "tests/smoke.sh=tests/unit/test_smoke_timing.py",
    "tests/smoke_cache.sh=tests/unit/test_smoke_state.py",
    "tests/js_check.sh=tests/unit/test_smoke_state.py",
    "tests/sandbox/update_patch.sh=tests/unit/test_smoke_state.py",
    "tests/sandbox/agy-stand-in=tests/unit/test_smoke_state.py",
    "tests/sandbox/codex-stand-in=tests/unit/test_smoke_state.py",
    # ... and what the pre-push hook chooses sections by: their `covers`, tests/smoke_selection.txt, tools/smoke_select.py.
    "tests/smoke.sh=tests/unit/test_smoke_select.py",
    "tests/smoke.sh=tests/unit/test_smoke_selection.py",
    "tests/smoke_cache.sh=tests/unit/test_smoke_select.py",
    "tests/smoke_selection.txt=tests/unit/test_smoke_select.py",
    "tests/smoke_selection.txt=tests/unit/test_smoke_selection.py",
    "tools/*.py=tests/unit/test_smoke_select.py",
    "tools/*.py=tests/unit/test_smoke_selection.py",
    "tools/*.py=tests/unit/test_shell_library.py",
    # ... and the guard that each section covers the commands it runs.
    "tests/smoke.sh=tests/unit/test_smoke_covers.py",
    "tools/*.py=tests/unit/test_smoke_covers.py",
    "libexec/*=tests/unit/test_smoke_covers.py",
    # ... and what --shard splits them by.
    "tests/smoke_weights.txt=tests/unit/test_smoke_select.py",
    # The Mac VM suites' parts: the selector, the shell helper the suites run them with, and mac.sh's options
    # (test_vm_select.py runs copies of them); the guard reads the suites and the rules (`*=` above).
    "tools/*.py=tests/unit/test_vm_select.py",
    "tools/*.py=tests/unit/test_vm_selection.py",
    "tests/sandbox/e2e_parts.sh=tests/unit/test_vm_select.py",
    "tests/sandbox/mac.sh=tests/unit/test_vm_select.py",
    "tests/vm_selection.txt=tests/unit/test_vm_select.py",
    # The commit hook's unit-test run and its pass record, and the hooks' order around it (CI's lint
    # job runs them all to the end).
    "tools/unit_hook.py=tests/unit/test_unit_hook.py",
    ".pre-commit-config.yaml=tests/unit/test_unit_hook.py",
    ".github/workflows/ci.yml=tests/unit/test_unit_hook.py",
    "tests/llm/*.py=tests/unit/test_learn.py",
    "tests/llm/*.py=tests/unit/test_learn_digest.py",
    "tests/llm/gh_stand_in.py=tests/unit/test_gh_stand_in.py",
    "tests/sandbox/mcp_probe_server.py=tests/unit/test_mcp_probe_server.py",
    # What no unit test reads or runs: CI, the repository's own settings, the other suites.
    ".github/**=tests/unit/test_impacted_rules.py",
    ".*=tests/unit/test_impacted_rules.py",
    "_typos.toml=tests/unit/test_impacted_rules.py",
    "tests/*.sh=tests/unit/test_impacted_rules.py",
    "tests/js/*=tests/unit/test_impacted_rules.py",
    "tests/sandbox/**=tests/unit/test_impacted_rules.py",
    # The VM's fictional acme world: its repositories, their history script, the gh stand-in and the ontology.
    "tests/sandbox/live/**=tests/unit/test_live_world.py",
]
# The fixtures, the app's version and publisher (which bosun reads as it runs, and the app's tests and
# tools too), and the tests' conftest with repo_guard.py, which every test loads (and which imports
# lib/ modules, a dependency the plugin leaves out of its analysis): any test may depend on them, so a
# change to one runs every test. (The rest of what bosun reads as it runs counts as a change to
# bin/bosun, above.)
impacted_invalidate_all = [
    "app/VERSION",
    "app/publisher.json",
    "tests/fixtures/**",
    "tests/unit/conftest.py",
    "tests/unit/repo_guard.py",
]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-include = ["libexec/bosun-resolve"]

[tool.ruff.lint]
extend-select = ["A", "ARG", "B", "C4", "C90", "E", "ERA", "F", "FURB", "G", "I", "PERF", "PIE", "PL", "PLC", "RET", "SIM", "T", "UP", "BLE", "S", "PGH", "RUF"]
ignore = [
    "T201",    # print is how these command-line tools talk
    "S603",    # subprocess calls with argument lists, no shell
    "S607",    # partial executable paths (ps, bosun) are intended
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "PLC0415", "ARG"]  # a stand-in has to take what it stands in for

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-statements = 50

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.mypy]
python_version = "3.13"
strict = true
files = ["lib", "libexec/bosun-resolve", "tests/unit", "tests/llm", "tests/sandbox/drive.py", "tests/sandbox/acme_year.py", "tests/sandbox/mcp_probe_server.py", "tools"]
mypy_path = "lib:tools:tests/llm"

[[tool.mypy.overrides]]
module = ["pytest_impacted", "pytest_impacted.*"]
ignore_missing_imports = true  # it ships no type information (tests/unit/test_impacted_rules.py)
