# The docs site, https://promptromp.github.io/bosun/, built from docs/ (docs/index.md is the home
# page, with theme/home.html) and the root files in tools/mkdocs_hooks.py. Build it with
# `uv run mkdocs build --strict`, or preview it with `uv run mkdocs serve`;
# .github/workflows/docs.yml publishes it from main.
site_name: bosun
site_description: Agents write the code. Bosun runs the rest of the day, and remembers it.
site_url: https://promptromp.github.io/bosun/
repo_name: promptromp/bosun
repo_url: https://github.com/promptromp/bosun

theme:
  name: material
  # Our own look on top of Material: theme/ overrides its templates (fonts, the home page),
  # docs/assets/site.css sets the type and colours.
  custom_dir: theme
  logo: assets/logo.png
  favicon: assets/logo.png
  # Loaded by theme/main.html, with the weights the headings use.
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Follow the system
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

hooks:
  - tools/mkdocs_hooks.py

extra_css:
  - assets/site.css

# A prototype page with its own build; it stays a link to GitHub.
exclude_docs: |
  design/prototypes/

# Fail the strict build on anything that would be a broken page or link.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  # Nested lists two spaces in, as GitHub reads them (Python-Markdown wants four).
  - mdx_truly_sane_lists:
      nested_indent: 2
  # Heading anchors as GitHub makes them, so a link with an anchor works on both.
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

nav:
  - Home: index.md
  - Guides:
      - Setup: setup.md
      - How a day runs: day.md
      - Commands: commands.md
      - Orchestrator: orchestrator.md
      - The ledger: ledger.md
      - Permissions: permissions.md
      - Events: events.md
      - Knowledge: knowledge.md
      - Learning: learning.md
      - Watchdog: watchdog.md
      - Console: console.md
      - Known limits: limits.md
  - Design:
      - Installing: design/init.md
      - Uninstalling: design/uninstall.md
      - Updating: design/update.md
      - Agents: design/harnesses.md
      - Antigravity windows: design/antigravity.md
      - Connectors: design/connectors.md
      - Approvals: design/approvals.md
      - Events: design/events.md
      - Signals: design/signals.md
      - Lineage and trackers: design/lineage.md
      - Workstreams: design/workstreams.md
      - Knowledge: design/knowledge.md
      - Learning: design/learning.md
      - Console: design/console.md
      - Impact: design/impact.md
      - Sync and sharing: design/sync.md
      - Plans:
          - Impact, phase A: plans/impact-phase-a.md
          - Impact, cost per task: plans/impact-cost-per-task.md
          - Impact, overhead: plans/impact-overhead.md
          - Sync, phase 0: plans/sync-phase-0.md
          - Updating: plans/update.md
          - Connectors: plans/connectors.md
          - Agents that say what they can do: plans/agent-profiles.md
  - Project:
      - Roadmap: roadmap.md
      - Development: development.md
      - Contributing: contributing.md
      - Security: security.md
      - Code of conduct: code-of-conduct.md

extra:
  social:
    - icon: simple/github
      link: https://github.com/promptromp/bosun

