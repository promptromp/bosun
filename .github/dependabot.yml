# Monthly dependency-update pull requests against main, one per ecosystem with all its updates:
# the GitHub Actions the workflows use, the dev tools pinned in uv.lock and the hook revisions in
# .pre-commit-config.yaml. Security updates come as soon as an advisory is published, outside this
# schedule. Every pull request runs the full CI, macOS smoke suite included, hence monthly and
# grouped.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
    cooldown: # not a release in its first week, in case it turns out to be bad; security updates do not wait
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown: # not a release in its first week, in case it turns out to be bad; security updates do not wait
      default-days: 7
    groups:
      dev-tools:
        patterns: ["*"]
  - package-ecosystem: docker # the sandbox's base image
    directory: /tests/sandbox
    schedule:
      interval: monthly
    cooldown: # not a release in its first week, in case it turns out to be bad; security updates do not wait
      default-days: 7
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    cooldown: # not a release in its first week, in case it turns out to be bad; security updates do not wait
      default-days: 7
    groups:
      hooks:
        patterns: ["*"]
