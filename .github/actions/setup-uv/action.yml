# uv and a Python for a CI job. Downloading uv sometimes fails with a transient "fetch failed", so
# the install is retried once after a short wait.
name: Set up uv
description: Install uv and a Python version (cached), retrying the download once.
inputs:
  python-version:
    description: The Python version uv uses.
    required: true
  enable-cache:
    description: >-
      Whether to restore and save uv's cache. "false" for a release job, which must not restore a cache
      that another run wrote.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - id: install
      continue-on-error: true
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: ${{ inputs.enable-cache }}
    - if: steps.install.outcome == 'failure'
      shell: bash
      run: sleep 20
    - if: steps.install.outcome == 'failure'
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: ${{ inputs.enable-cache }}
