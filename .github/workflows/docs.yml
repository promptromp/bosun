# Publishes the docs site (mkdocs.yml) to GitHub Pages, https://promptromp.github.io/bosun/, from main.
# Every pull request already builds it with --strict (the docs-site hook in `lint`), so this only
# publishes. It uses GitHub's Pages actions rather than pushing a gh-pages branch, so no job here can
# write to the repository: the build job reads, and only the deploy job may publish the site. The
# repository's Pages source is "GitHub Actions" (gh api repos/{owner}/{repo}/pages, build_type=workflow).
name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - "*.md"
      - mkdocs.yml
      - tools/mkdocs_hooks.py
      - tools/check_links.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time, and a newer one waits rather than cancelling one already deploying.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.13"
      - run: uv run --locked --only-group docs mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
