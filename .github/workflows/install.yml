# A new machine's install: for real on a clean macOS runner (tests/install_e2e.sh, the Mac VM's `run` suite: the
# piped installer, launchd jobs that really fire, the real pmset and plutil, and an update from a release to the
# next, from an origin with a release in it, as tests/sandbox/mac.sh makes it), and the wizard through a real
# terminal in the Docker sandbox (tests/sandbox.sh), which would otherwise only run by hand and rot. On a pull
# request, `changes` asks tools/vm_select.py which parts of the suite the change reaches (the parts' `covers` and
# tests/vm_selection.txt, as `tests/sandbox.sh mac run --changed` does) and the runner runs those; the change that
# reaches none starts no runner. Weekly and by hand, the whole suite, to notice when a new macOS or Homebrew breaks
# it. Not required checks: they run only when the install could have changed, and a required check that does not
# run blocks a merge.
name: Install

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Which parts of tests/install_e2e.sh the pull request reaches: `run` is false when it reaches none, `parts` the
  # ones to run (with what they need), empty for the whole suite. Not a pull request: the whole suite. Only an
  # answer from a run that succeeded narrows it: a failed run, or no answer line, runs the whole suite (fail closed).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.select.outputs.run }}
      parts: ${{ steps.select.outputs.parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the merge base with the pull request's base
      - name: Which parts of the install suite does the change reach?
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -u
          if [ "$EVENT" != pull_request ]; then
            echo "Not a pull request ($EVENT): the whole suite."
            printf 'run=true\nparts=\n' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          status=0
          report=$(python3 tools/vm_select.py --root . --suite run --changed "$BASE" 2>&1) || status=$?
          echo "$report"
          last=$(printf '%s\n' "$report" | tail -n 1)
          case "$status:$last" in
            "0:=> none") printf 'run=false\nparts=\n' >>"$GITHUB_OUTPUT" ;;
            "0:=> only "?*)
              parts=${last#=> only }
              printf 'run=true\nparts=%s\n' "${parts%% *}" >>"$GITHUB_OUTPUT"
              ;;
            *) printf 'run=true\nparts=\n' >>"$GITHUB_OUTPUT" ;;
          esac

  clean-mac:
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      RELEASE: v2026.11.01 # the first release, as tests/sandbox/mac.sh's RUN_RELEASE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the origin below holds the checkout's history, as the VM's does
      # The origin a first install takes on the `releases` channel, with that release in it: the suite's `releases`
      # and `branch` parts update from it, as in the VM.
      - name: The origin of a first release
        run: tests/sandbox/release_origin.sh . HEAD "$HOME/origin.git" "$RELEASE"
      - name: The install suite (tests/install_e2e.sh), the parts chosen
        run: BOSUN_REPO="$HOME/origin.git" BOSUN_E2E_RELEASE="$RELEASE" tests/install_e2e.sh
        env:
          GH_TOKEN: ${{ github.token }} # so `gh auth status` passes, as for someone logged in
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          E2E_PARTS: ${{ needs.changes.outputs.parts }} # empty: the whole suite

  # The first day in the Docker sandbox walks the same install (the wizard, a morning, re-runs, an uninstall): it
  # runs when the install suite does.
  sandbox:
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tests/sandbox.sh init
