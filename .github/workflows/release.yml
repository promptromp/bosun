# Cuts a release: a dated annotated tag on main (v<YYYY.MM.DD>, then .2, ...) and a GitHub release with
# the same notes, which `bosun update` follows (docs/design/menu-bar.md, "Releases"). Weekly, and by hand.
# It does nothing when main has no commit since the newest release tag, or when main's head was not
# checked with every required check green. Through the merge queue main's head is the merge group's commit, which every
# required check ran on, so the checks are read on main's head itself; for a commit merged before the
# queue, from the pull request it was merged from. The decision is tools/release.py gate, and this
# job only gathers what it needs. The required checks' names are read
# from .github/rulesets/main.json.
name: Release

on:
  schedule:
    - cron: "0 6 * * 1" # Monday, 06:00 UTC
  workflow_dispatch:

# It reads the pull request and its check runs (public, but the job says what it reads) and pushes the tag.
permissions:
  contents: write
  pull-requests: read
  checks: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true # the tag is pushed with this token
      - name: Is there something to release, and was it checked?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          last=$(python3 tools/release.py latest)
          if [ -n "$last" ] && [ -z "$(git rev-list -n 1 "$last..HEAD")" ]; then
            echo "No commit on main since $last."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -r '.rules[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context' \
            .github/rulesets/main.json > "$RUNNER_TEMP/required.txt"
          main_sha=$(git rev-parse HEAD)
          main_tree=$(git rev-parse 'HEAD^{tree}')
          pr_head=$(gh api "repos/$REPO/commits/$main_sha/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].head.sha // empty')
          pr_tree=""
          : > "$RUNNER_TEMP/runs.json"
          gh api --paginate "repos/$REPO/commits/$main_sha/check-runs" --jq '.check_runs[]' > "$RUNNER_TEMP/head-runs.json"
          if [ -n "$pr_head" ]; then
            pr_tree=$(gh api "repos/$REPO/git/commits/$pr_head" --jq .tree.sha)
            gh api --paginate "repos/$REPO/commits/$pr_head/check-runs" --jq '.check_runs[]' > "$RUNNER_TEMP/runs.json"
          fi
          if ! python3 tools/release.py gate --required-file "$RUNNER_TEMP/required.txt" --runs-file "$RUNNER_TEMP/runs.json" \
            --head-runs-file "$RUNNER_TEMP/head-runs.json" \
            --pr-tree "$pr_tree" --main-tree "$main_tree" > "$RUNNER_TEMP/why.txt"; then
            echo "Not releasing $main_sha: $(cat "$RUNNER_TEMP/why.txt")"
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "go=true"
            echo "last=$last"
          } >> "$GITHUB_OUTPUT"
      - name: Tag and release
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LAST: ${{ steps.gate.outputs.last }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898274+github-actions[bot]@users.noreply.github.com"
          tag=$(python3 tools/release.py next-tag)
          # The first release has no earlier tag to count from: its notes say so, not the whole history.
          if [ -n "$LAST" ]; then
            python3 tools/release.py notes "$LAST..HEAD" > "$RUNNER_TEMP/notes.md"
          else
            echo "- First release" > "$RUNNER_TEMP/notes.md"
          fi
          git tag -a "$tag" -F "$RUNNER_TEMP/notes.md"
          git push origin "refs/tags/$tag"
          gh release create "$tag" --verify-tag --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
