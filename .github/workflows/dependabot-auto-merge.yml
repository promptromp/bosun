# Turns on auto-merge for the Dependabot pull requests that need no one's judgement, following GitHub's
# "Automating Dependabot with GitHub Actions" (the "Enable auto-merge on a pull request" example).
# Auto-merge does not skip anything: GitHub merges the pull request once its required checks pass, and
# with the merge queue on (.github/rulesets/main.json) that means adding it to the queue, which tests
# it on top of the latest main like any other pull request. A person still sees every one of them.
#
# What qualifies, by what .github/dependabot.yml configures (patch and minor updates only; a major
# update, or an update group that includes one, waits for a person):
#   - github-actions: the pinned actions of the workflows
#   - docker: the sandbox's base image (tests/sandbox)
#   - pre-commit: the hook revisions
#   - uv: development dependencies only (the dev group in pyproject.toml); a production dependency waits
# Anything else, and any pull request not opened by Dependabot, is left alone.
#
# It runs on `pull_request` (never `pull_request_target`), checks out nothing and uses no secret: the
# job's token is the one GitHub gives the run, with write access to the pull request only on this job.
# The repository setting "Allow auto-merge" must be on for `gh pr merge --auto` to work.
name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # The pull request's author, by name and by Dependabot's account id (a name alone could be taken
    # by another account, and `github.actor` is only whoever last acted, which zizmor refuses).
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.user.id == 49699333
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge
        if: >-
          (steps.metadata.outputs.update-type == 'version-update:semver-patch'
          || steps.metadata.outputs.update-type == 'version-update:semver-minor')
          && (steps.metadata.outputs.package-ecosystem == 'github_actions'
          || steps.metadata.outputs.package-ecosystem == 'docker'
          || steps.metadata.outputs.package-ecosystem == 'pre_commit'
          || (steps.metadata.outputs.package-ecosystem == 'uv'
          && steps.metadata.outputs.dependency-type == 'direct:development'))
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
