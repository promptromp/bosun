# The checks a pull request to main must pass; the ruleset on main (.github/rulesets/main.json)
# requires these jobs by name, so rename or add a job there too. Every tool comes from uv.lock, as
# for the local hooks. Pull requests and the merge queue's merge groups (each PR on top of the latest
# main and the PRs ahead of it; without `merge_group` the queue would wait forever for checks that
# never report), not again on the push to main: main only ever gets what
# a pull request passed. The logs are public, so neither check prints what it
# matched: FORBIDDEN_TERMS_REDACT and gitleaks --redact.
name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every hook in .pre-commit-config.yaml, so a commit made without them (--no-verify, or a clone
  # where they were never installed) cannot slip past. The unit tests run in `test`.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the pull request's or merge group's commit messages
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # The list of terms that must never reach the repo lives outside it; here it comes from the
      # FORBIDDEN_TERMS secret (one regex per line). Without the secret the list is empty and the
      # check passes, as on a machine without the file.
      - name: Forbidden-terms list
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          mkdir -p "$RUNNER_TEMP/config"
          printf '%s\n' "$FORBIDDEN_TERMS" >"$RUNNER_TEMP/config/forbidden-terms.txt"
      - name: pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: unit-tests,no-commit-to-branch
          BOSUN_CONFIG_DIR: ${{ runner.temp }}/config
          FORBIDDEN_TERMS_REDACT: "1"
      # A merge group has no title or description (the pull request's run checked those), only the
      # commit messages between the main it is built on and its own commit.
      - name: Forbidden terms in the pull request's title, description and commit messages
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BOSUN_CONFIG_DIR: ${{ runner.temp }}/config
          FORBIDDEN_TERMS_REDACT: "1"
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          # An empty range must fail, not pass by checking nothing.
          : "${BASE:?no base commit for this event}" "${HEAD:?no head commit for this event}"
          { printf '%s\n\n%s\n\n' "$TITLE" "$BODY"; git log --format=%B "$BASE..$HEAD"; } >"$RUNNER_TEMP/messages.txt"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/messages.txt" || { echo "no commit messages to check" >&2; exit 1; }
          uv run python tools/forbidden_terms.py --contents-only "$RUNNER_TEMP/messages.txt"

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the floor (pyproject's requires-python). 3.15 comes back once it is released and
        # the suite is fast.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      # Every unit test, in parallel, never only those a change reaches (the commit hook's
      # --impacted). Coverage here only: it would slow the commit hook, and a floor is about the
      # long run. COVERAGE_CORE=sysmon: coverage.py measures through sys.monitoring (Python 3.12 and
      # newer), as it already does by default on 3.14, instead of 3.13's sys.settrace, which made
      # every test about a quarter slower and 3.13 the slowest job; it reports the same lines
      # (95.65 percent against 95.66).
      - run: uv run pytest -n auto --cov=lib --cov=tools --cov-fail-under=94 --cov-report=term:skip-covered
        env:
          COVERAGE_CORE: sysmon

  # On macOS like the machines bosun runs on (the scripts use BSD date and /bin/bash 3.2): every
  # unit test once, in parallel, then the end-to-end suite, which leaves the unit tests to the first
  # step.
  #
  # Off until the feature-complete MVP (2026-11-13, the repo owner's decision): it takes 15-20
  # minutes on a scarce macOS runner per pull request, while basic features are still being built.
  # The smoke suite still runs locally, for the sections a push reaches (the pre-push hook,
  # `tests/smoke.sh --pre-push`). To turn it back on, remove the `if` line (or set the repository variable CI_SMOKE to true; actionlint refuses a
  # constant `if: false`) and re-add `smoke` to .github/rulesets/main.json's required checks, then
  # apply the ruleset. While off it is skipped in merge groups too, and the queue does not
  # wait on it.
  smoke:
    if: ${{ vars.CI_SMOKE == 'true' }}
    runs-on: macos-latest
    # The end-to-end suite took about 13 of the 20 minutes on GitHub's macOS runner, the unit tests,
    # one at a time, the other 7.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Install tmux
        run: brew install tmux
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
      - name: Unit tests
        run: uv run pytest -n auto
      - name: End to end
        run: tests/smoke.sh

  # Whether the menu bar app's job has anything to do: a cheap Linux job, so that a pull request that does not
  # touch the app never starts a macOS runner, which are scarce. Builds (build=true) unless it can show that
  # nothing the app depends on changed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.changed.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the merge base with the pull request's base
      # Not a pull request or merge group (by hand), no merge base with the base, or a diff that cannot be made: build.
      - name: Did anything the app depends on change?
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -u
          if [ "$EVENT" != pull_request ] && [ "$EVENT" != merge_group ]; then
            echo "Not a pull request or merge group: building."
            echo "build=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: a file moved out of app/ shows its old path too, not only the new one
          if ! git merge-base "$BASE" "$HEAD" >/dev/null 2>&1 || ! files=$(git diff --name-only --no-renames "$BASE...$HEAD"); then
            echo "No merge base with the base branch, or no diff: building."
            echo "build=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          build=false
          while IFS= read -r file; do
            case $file in
              app/* | tools/contract_samples.py | tools/swift_coverage.py | .github/workflows/ci.yml | .github/actions/setup-uv/* | uv.lock | pyproject.toml)
                echo "Changed: $file"
                build=true
                ;;
              *) ;;
            esac
          done <<<"$files"
          if [ "$build" = false ]; then
            echo "Nothing the app job depends on changed (app/, its two tools, this workflow, setup-uv, uv.lock, pyproject.toml): not building."
          fi
          echo "build=$build" >>"$GITHUB_OUTPUT"

  # The menu bar app (app/, docs/design/menu-bar.md): its tests with warnings as errors, a floor under
  # the coverage of its core, SwiftLint, swift-format, and an ad hoc signed build that must verify.
  # Required on every pull request, and it answers merge groups too: when `changes` finds nothing the app
  # depends on, this job is skipped, which a required check counts as passing, so no macOS runner starts;
  # `changes` is required too (in .github/rulesets/main.json), so a failed `changes` cannot let an app change through
  # unbuilt.
  # tools/contract_samples.py writes the fixtures under app/, so contract drift is caught by the Linux
  # `test` jobs (tests/unit/test_contract_samples.py) on every pull request and by this job when the
  # fixtures change. The release is .github/workflows/release-app.yml.
  app:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Swift toolchain
        run: swift --version
      - name: Tests, warnings as errors
        working-directory: app
        run: swift test --enable-code-coverage -Xswiftc -warnings-as-errors
      - name: Coverage floor (the core and the system layer, each 95% of its lines)
        run: uv run python tools/swift_coverage.py
      - name: SwiftLint
        working-directory: app
        run: swift package plugin --allow-writing-to-package-directory swiftlint lint --strict
      - name: swift format lint
        working-directory: app
        run: swift format lint --strict -r Sources Tests Package.swift
      - name: Build, ad hoc signed
        env:
          OUT: ${{ runner.temp }}/bosun-app
        run: |
          set -eu
          app/build.sh --identity - --out "$OUT"
          plutil -lint "$OUT/bosun.app/Contents/Info.plist"
          codesign --verify --deep --strict "$OUT/bosun.app"

  # Secrets in any commit of the pull request or merge group (all history when run by hand), not only in the final
  # tree that the detect-secrets hook sees: a commit that adds a token and a later one that removes
  # it. A made-up value in a test carries a `gitleaks:allow` comment. The CLI rather than the
  # action, which wants a license key in a repository owned by an organization; Dependabot does not
  # update it, so bump VERSION and SHA256 together (the release's checksums.txt).
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # pragma: allowlist secret (a public checksum)
        run: |
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/$archive"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || github.event_name == 'merge_group' && format('{0}..{1}', github.event.merge_group.base_sha, github.event.merge_group.head_sha) || '--all' }}
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="$RANGE" .'
